name: Namespace runner benchmark

on:
  workflow_dispatch:
    inputs:
      workload:
        description: Workload to run
        type: choice
        options: [all, small-node, monorepo]
        default: all
      scenario:
        description: Scenario label
        type: string
        default: manual

permissions:
  contents: read

concurrency:
  group: namespace-runner-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: namespace-profile-deenster
    timeout-minutes: 20
    env:
      BENCH_PROVIDER: namespace
      BENCH_WORKLOAD: ${{ inputs.workload || 'all' }}
      BENCH_SCENARIO: ${{ inputs.scenario || 'manual' }}
      BENCH_RUNNER_LABEL: namespace-profile-deenster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .bench-cache
          key: task-v1-${{ runner.os }}-${{ hashFiles('workloads/**/src/**') }}
          restore-keys: |
            task-v1-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - run: npm run bench -- --provider "$BENCH_PROVIDER" --workload "$BENCH_WORKLOAD" --scenario "$BENCH_SCENARIO"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: namespace-runner-results-${{ github.run_id }}
          path: results/
